name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # 模块缓存由下一步 actions/cache 负责；两者同时恢复同一目录会因 tar 冲突失败。
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-

      - name: Download dependencies
        run: go mod download

      - name: Verify import layering
        run: |
          chmod +x ./scripts/verify_imports.sh
          ./scripts/verify_imports.sh

      - name: Run tests with race detection
        run: go test -v -race -timeout 10m -coverprofile=coverage.out ./...

      - name: Verify isolated benchmark contracts
        run: make test-frameworkbench

      - name: Verify slogx logging example
        run: make test-example-slogx

      - name: Verify API exposure checker
        run: make test-exposurecheck

      - name: Check coverage gates
        run: bash scripts/check_coverage.sh coverage.out coverage-summary.md

      - name: Comment PR with coverage
        uses: actions/github-script@v7
        # 门禁失败也贴出明细；测试步骤失败时没有摘要，不评论。
        if: always() && github.event_name == 'pull_request' && hashFiles('coverage-summary.md') != ''
        with:
          script: |
            const fs = require('fs');

            // 门槛与结果都来自 scripts/coverage-gates.txt 经 coveragecheck 生成的表，这里不重复声明。
            const table = fs.readFileSync('coverage-summary.md', 'utf8');

            const body = `## 📊 Test Coverage Report

            ${table}
            门槛见 \`scripts/coverage-gates.txt\`；本地复现：\`make coverage-check PROFILE=coverage.out\`。

            ---

            ### Checklist

            - [ ] All tests pass
            - [ ] Code is properly formatted (\`make fmt\`)
            - [ ] Import layering rules are satisfied
            - [ ] Test coverage meets requirements (see above)
            - [ ] All linter checks pass
            `;

            await core.summary.addRaw(body).write();

            // fork 发起的 PR 中 GITHUB_TOKEN 被强制只读，无法评论，报告仅输出到 job summary
            const headRepo = context.payload.pull_request.head.repo?.full_name;
            if (headRepo !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info(`来自 fork 的 PR (${headRepo})，跳过评论`);
              return;
            }

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Test Coverage Report')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      # 仓库未配置 CODECOV_TOKEN 时跳过：无令牌上传会被 Codecov 拒绝。门禁以上一步为准。
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          disable_search: true
          flags: unittests
          name: codecov-umbrella

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check code formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Please run 'make fmt'"
            gofmt -l .
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout=5m

      # 只有代码实际调用到的漏洞才会使其失败；仅被依赖、未被调用的漏洞只报告。
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Run offline host example
        run: make run
