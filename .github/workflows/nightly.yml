name: Nightly Build

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  nightly:
    name: Nightly Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.23-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.23-

      - name: Download dependencies
        run: go mod download

      - name: Run all tests
        run: |
          GO_TEST_MODE=true go test -v -race -timeout 10m -coverprofile=coverage.out ./...

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -run=^$ ./... > benchmark_results.txt
          cat benchmark_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark_results.txt

      - name: Check for dependency updates
        run: |
          go list -u -m all > dependency_updates.txt
          if grep -q '\[' dependency_updates.txt; then
            echo "::warning::Dependencies have updates available"
            cat dependency_updates.txt
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.out

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // 检查是否已存在打开的 nightly-failure issue
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'nightly-failure',
              state: 'open'
            });

            if (existingIssues.data.length > 0) {
              // 已存在打开的 issue，添加评论而不是创建新 issue
              const issueNumber = existingIssues.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `🔄 **又一次构建失败**

**提交**: ${context.sha}
**工作流运行**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
**时间**: ${new Date().toISOString()}`
              });
              console.log(`Added comment to existing issue #${issueNumber}`);
            } else {
              // 没有打开的 issue，创建新的
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '❌ Nightly Build Failed',
                body: `Nightly build failed for commit ${context.sha}

**工作流运行**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

请调查并修复问题。`,
                labels: ['ci', 'nightly-failure']
              });
              console.log('Created new nightly-failure issue');
            }

      - name: Close issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            // 构建成功时，关闭所有打开的 nightly-failure issues
            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'nightly-failure',
              state: 'open'
            });

            for (const issue of openIssues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ **问题已修复**

Nightly Build 在提交 ${context.sha} 上成功通过。
**工作流运行**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
              console.log(`Closed issue #${issue.number}`);
            }
