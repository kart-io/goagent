name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  nightly:
    name: Nightly Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.25-v1-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.25-v1-

      - name: Download dependencies
        run: go mod download

      # --- 新增步骤：安装 gotestsum ---
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      # --- 修改步骤：使用 gotestsum 运行测试（增加重试和并发控制）---
      - name: Run all tests
        run: |
          # gotestsum 参数说明：
          # --format testname: 简洁输出
          # --junitfile: 生成 XML 报告
          # --rerun-fails: 失败测试自动重试（最多2次）
          # --rerun-fails-max-failures: 最多重试10个失败测试
          # --packages: 显式指定包列表（--rerun-fails 必需）
          #
          # go test 参数说明：
          # -race: 竞态检测
          # -timeout 30m: 总超时时间延长到30分钟
          # -parallel 4: 限制并行测试数量，避免资源竞争
          # -count 1: 禁用测试缓存，确保每次都执行
          gotestsum \
            --format testname \
            --junitfile unit-tests.xml \
            --rerun-fails \
            --rerun-fails-max-failures 10 \
            --packages="./..." \
            -- \
            -race \
            -timeout 30m \
            -parallel 4 \
            -count 1 \
            ./...
        env:
          GO_TEST_MODE: "true"
          # 增加 Go 运行时配置，提高并发稳定性
          GOMAXPROCS: "4"
          # 启用 CGO 以支持 SQLite 测试和 Race 检测
          CGO_ENABLED: "1"

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -run=^$ ./... > benchmark_results.txt
          cat benchmark_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark_results.txt

      - name: Check for dependency updates
        run: |
          go list -u -m all > dependency_updates.txt
          if grep -q '\[' dependency_updates.txt; then
            echo "::warning::Dependencies have updates available"
            cat dependency_updates.txt
          fi

      - name: Upload coverage report
        if: hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.out

      # --- 新增步骤：上传测试结果 XML (即使失败也上传) ---
      - name: Upload test results
        if: always() # 确保即使测试失败也能拿到报告
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: unit-tests.xml

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existingIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              labels: 'nightly-failure',
              state: 'open'
            });

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            if (existingIssues.data.length > 0) {
              const issueNumber = existingIssues.data[0].number;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body:
                  '🔄 又一次构建失败\n\n' +
                  `提交: ${context.sha}\n` +
                  `工作流运行: ${runUrl}\n` +
                  `时间: ${new Date().toISOString()}`
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: '❌ Nightly Build Failed',
                body:
                  `Nightly build failed for commit ${context.sha}\n\n` +
                  `工作流运行: ${runUrl}\n\n` +
                  '请调查并修复问题。',
                labels: ['ci', 'nightly-failure']
              });
            }

      - name: Close issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              labels: 'nightly-failure',
              state: 'open'
            });

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            for (const issue of openIssues.data) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed'
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body:
                  '✅ 问题已修复\n\n' +
                  `Nightly Build 在提交 ${context.sha} 上成功通过。\n` +
                  `工作流运行: ${runUrl}`
              });
            }