name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  nightly:
    name: Nightly Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.24-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.24-

      - name: Download dependencies
        run: go mod download

      - name: Run all tests
        run: |
          GO_TEST_MODE=true go test -v -race -timeout 10m -coverprofile=coverage.out ./...

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -run=^$ ./... > benchmark_results.txt
          cat benchmark_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark_results.txt

      - name: Check for dependency updates
        run: |
          go list -u -m all > dependency_updates.txt
          if grep -q '\[' dependency_updates.txt; then
            echo "::warning::Dependencies have updates available"
            cat dependency_updates.txt
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.out

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existingIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              labels: 'nightly-failure',
              state: 'open'
            });

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            if (existingIssues.data.length > 0) {
              const issueNumber = existingIssues.data[0].number;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body:
                  '🔄 又一次构建失败\n\n' +
                  `提交: ${context.sha}\n` +
                  `工作流运行: ${runUrl}\n` +
                  `时间: ${new Date().toISOString()}`
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: '❌ Nightly Build Failed',
                body:
                  `Nightly build failed for commit ${context.sha}\n\n` +
                  `工作流运行: ${runUrl}\n\n` +
                  '请调查并修复问题。',
                labels: ['ci', 'nightly-failure']
              });
            }

      - name: Close issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              labels: 'nightly-failure',
              state: 'open'
            });

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            for (const issue of openIssues.data) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed'
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body:
                  '✅ 问题已修复\n\n' +
                  `Nightly Build 在提交 ${context.sha} 上成功通过。\n` +
                  `工作流运行: ${runUrl}`
              });
            }
