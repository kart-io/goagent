name: Bounded live provider regression
on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
# One bounded run at a time; do not interrupt an already paid run.
concurrency:
  group: provider-live
  cancel-in-progress: false
jobs:
  live:
    # Opt in after configuring the environment's secrets and model variables.
    # Pull requests never receive credentials or trigger paid calls.
    if: vars.ENABLE_PROVIDER_LIVE == 'true'
    environment: provider-live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provider: [gemini, deepseek]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Bounded synthetic live checks (no retries)
        run: bash scripts/provider_live.sh "$PROVIDER" live-results
        env:
          PROVIDER: ${{ matrix.provider }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: live-results/
          retention-days: 14
