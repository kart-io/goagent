  "components": {
    "schemas": {
      "KnownTokens": {
        "type": "object",
        "description": "已知部分之和；完整性由complete与未知计数说明，不能将缺失字段推断为实际零消耗。",
        "properties": {
          "prompt_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "completion_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "total_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "cached_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "reasoning_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "tool_use_prompt_tokens": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "RunTotals": {
        "type": "object",
        "properties": {
          "tasks": {
            "type": "integer",
            "minimum": 0
          },
          "attempts": {
            "type": "integer",
            "minimum": 0
          },
          "known_runs": {
            "type": "integer",
            "minimum": 0
          },
          "unknown_runs": {
            "type": "integer",
            "minimum": 0
          },
          "partial_runs": {
            "type": "integer",
            "minimum": 0
          },
          "queued_millis": {
            "type": "integer",
            "minimum": 0
          },
          "execution_millis": {
            "type": "integer",
            "minimum": 0
          },
          "waiting_millis": {
            "type": "integer",
            "minimum": 0
          },
          "known_tokens": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/KnownTokens"
              },
              {
                "type": "null"
              }
            ]
          },
          "states": {
            "type": "object",
            "additionalProperties": {
              "type": "integer",
              "minimum": 0
            }
          },
          "complete": {
            "type": "boolean"
          },
          "duration_complete": {
            "type": "boolean"
          },
          "duration_incomplete_runs": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "RunGroup": {
        "allOf": [
          {
            "$ref": "#/components/schemas/RunTotals"
          },
          {
            "type": "object",
            "required": [
              "id"
            ],
            "properties": {
              "id": {
                "type": "string"
              }
            }
          }
        ]
      },
      "AgentUsageTotal": {
        "type": "object",
        "properties": {
          "agent_id": {
            "type": "string"
          },
          "known_tokens": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/KnownTokens"
              },
              {
                "type": "null"
              }
            ]
          },
          "known_entries": {
            "type": "integer",
            "minimum": 0
          },
          "unknown_entries": {
            "type": "integer",
            "minimum": 0
          },
          "partial_entries": {
            "type": "integer",
            "minimum": 0
          },
          "complete": {
            "type": "boolean"
          }
        }
      },
      "RunSummary": {
        "type": "object",
        "required": [
          "totals",
          "agents",
          "sessions",
          "created_to"
        ],
        "properties": {
          "created_to": {
            "type": "string",
            "format": "date-time",
            "description": "固定创建时间范围，各页证据在扫描时采样，不是事务快照。"
          },
          "totals": {
            "$ref": "#/components/schemas/RunTotals"
          },
          "agents": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RunGroup"
            }
          },
          "sessions": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RunGroup"
            }
          },
          "agent_usage": {
            "type": [
              "array",
              "null"
            ],
            "items": {
              "$ref": "#/components/schemas/AgentUsageTotal"
            },
            "description": "跨运行按Agent聚合self，包含嵌套Agent；不加inclusive。"
          },
          "unattributed": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/KnownTokens"
              },
              {
                "type": "null"
              }
            ]
          },
          "unattributed_known_entries": {
            "type": "integer",
            "minimum": 0
          },
          "unattributed_unknown_entries": {
            "type": "integer",
            "minimum": 0
          },
          "unattributed_partial_entries": {
            "type": "integer",
            "minimum": 0
          },
          "unattributed_complete": {
            "type": "boolean",
            "description": "未归属证据完整性；混合已知与未知时为false，unattributed只表示已知部分。"
          }
        }
      },
      "Run": {
        "type": "object",
        "properties": {
          "task": {
            "type": "object"
          },
          "attempts": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string"
                },
                "number": {
                  "type": "integer",
                  "minimum": 0
                },
                "created_at": {
                  "type": "string",
                  "format": "date-time"
                },
                "finished_at": {
                  "type": [
                    "string",
                    "null"
                  ],
                  "format": "date-time"
                },
                "outcome": {
                  "type": "string"
                },
                "trace_id": {
                  "type": "string",
                  "description": "真实OTel TraceID，未配置时省略。"
                }
              }
            }
          },
          "usage": {
            "type": [
              "object",
              "null"
            ],
            "description": "核心budget.AttributionReport的持久证据；只读，不创建缺失账本。"
          },
          "usage_status": {
            "enum": [
              "available",
              "partial",
              "missing",
              "unavailable"
            ]
          },
          "complete": {
            "type": "boolean",
            "description": "用量证据是否完整，不是Task业务终态。"
          },
          "trace_id": {
            "type": "string"
          },
          "queued_millis": {
            "type": "integer",
            "minimum": 0
          },
          "execution_millis": {
            "type": "integer",
            "minimum": 0
          },
          "waiting_millis": {
            "type": "integer",
            "minimum": 0
          },
          "elapsed_millis": {
            "type": "integer",
            "minimum": 0
          },
          "duration_complete": {
            "type": "boolean",
            "description": "历史未结束Attempt存在时为false；不虚构崩溃退出时间。"
          },
          "unfinished_attempts": {
